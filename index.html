<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Anvi & Anuj Wedding Invite</title>

<!-- Premium Fonts -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    overflow-x:hidden;
    font-family:Georgia, serif;
    background:#f3f1e7;
}

/* =========================
LOADER
========================= */

.loader{
    position:fixed;
    inset:0;
    background:#dbe3cd;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99999;
    color:#5c7342;
    font-size:1.2rem;
    letter-spacing:2px;
    transition:1s ease;
}

.loader.hide{
    opacity:0;
    pointer-events:none;
}

/* =========================
OPENING SCREEN
========================= */

.opening-screen{
    position:fixed;
    inset:0;
    background:#dbe3cd;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:9997;
    overflow:hidden;
    transition:1.2s ease;
}

.opening-screen.hide{
    opacity:0;
    visibility:hidden;
}

/* =========================
FLOATING ELEMENTS
========================= */

.floating-elements{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    overflow:visible;
    pointer-events:none;
    z-index:9998;
}

.flower,
.butterfly{
    position:absolute;
    top:-100px;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    opacity:0.85;
}

.flower{
    animation-name:fall;
}

.butterfly{
    animation-name:butterflyFly;
}

@keyframes fall{

    0%{
        transform:translateY(-100px) rotate(0deg);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:translateY(200vh) rotate(360deg);
        opacity:0;
    }
}

@keyframes butterflyFly{

    0%{
        transform:translate(-10vw,-10vh) scale(0.8);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    50%{
        transform:translate(50vw,35vh) scale(1);
    }

    100%{
        transform:translate(110vw,200vh) scale(0.8);
        opacity:0;
    }
}

/* =========================
ENVELOPE
========================= */

.envelope-wrapper{
    position:relative;
    width:320px;
    height:240px;
    perspective:1200px;
    z-index:10;
}

.envelope{
    position:relative;
    width:100%;
    height:100%;
}

.envelope-back{
    position:absolute;
    inset:0;
    background:#b7c5a3;
    border-radius:8px;
    box-shadow:0 15px 40px rgba(0,0,0,0.15);
}

.envelope-flap{
    position:absolute;
    width:100%;
    height:120px;
    background:#a8b896;
    top:0;
    left:0;
    transform-origin:top;
    transition:1.2s ease;
    clip-path:polygon(0 0,100% 0,50% 100%);
    z-index:5;
}

.floral{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
    opacity:0.12;
    z-index:2;
}

/* =========================
SEAL
========================= */

.seal{

    position:absolute;
    width:90px;
    height:90px;
    border-radius:50%;
    background:#c69b59;
    color:#4b2e1f;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:0.24rem;
    letter-spacing:0px;
    font-weight:600;

    font-family:
    "Palatino Linotype",
    "Book Antiqua",
    "URW Palladio L",
    serif;

    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:10;
    cursor:pointer;
    transition:0.3s ease;

    box-shadow:0 8px 25px rgba(0,0,0,0.18);
}

.seal:hover{
    transform:translate(-50%,-50%) scale(1.05);
}

.envelope.open .envelope-flap{
    transform:rotateX(180deg);
}

.envelope.open .seal{
    opacity:0;
    pointer-events:none;
}

/* =========================
INVITE TEXT
========================= */

.invite-text{
    margin-top:70px;
    text-align:center;
    z-index:10;
    position:relative;
}

.invite-text h1{
    font-size:4rem;
    color:#6e8a4b;
    font-weight:400;
    margin-bottom:10px;
}

.invite-text p{
    color:#5d4a3d;
    font-size:1.3rem;
    letter-spacing:1px;
}

/* =========================
MAIN WEBSITE
========================= */

.main-content{
    opacity:0;
    transition:1s ease;
}

.main-content.show{
    opacity:1;
}

.container{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:40px;
    padding:40px 0;
    position:relative;
    z-index:1;
}

/* =========================
PAGES
========================= */

.page{

    width:min(95vw,900px);

    border-radius:18px;

    overflow:hidden;

    background:white;

    position:relative;

    z-index:2;

    box-shadow:0 10px 35px rgba(0,0,0,0.15);

    transition:
    transform 1.2s ease,
    opacity 1.2s ease,
    box-shadow 0.6s ease;

    transform:translateY(80px) scale(0.96);

    opacity:0;
}

.page.reveal{

    opacity:1;

    transform:
    translateY(0px)
    scale(1);

    animation:
    gentleFloat 6s ease-in-out infinite;
}

.page:hover{

    transform:
    translateY(-6px)
    scale(1.01);

    box-shadow:
    0 20px 50px rgba(0,0,0,0.22);
}

.page img{

    width:100%;
    display:block;

    transition:
    transform 7s ease,
    filter 1.5s ease;
}

.page.reveal img{
    transform:scale(1.02);
}

.page::before{

    content:"";

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        to bottom,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0)
    );

    z-index:3;

    pointer-events:none;
}

/* =========================
TEXT OVERLAYS
========================= */

.overlay-text{

    position:absolute;

    z-index:20;

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    pointer-events:none;

    opacity:0;

    transform:
    translateY(40px)
    scale(0.96);

    transition:
    all 1.8s ease;
}

.page.reveal .overlay-text{

    opacity:1;

    transform:
    translateY(0px)
    scale(1);
}

.overlay-title{

    font-family:
    'Great Vibes',
    cursive;

    color:#d4af37;

    text-shadow:
    0 0 10px rgba(212,175,55,0.5),
    0 0 20px rgba(212,175,55,0.35);

    animation:
    shimmer 4s linear infinite,
    floatText 6s ease-in-out infinite;

    letter-spacing:2px;
}

.overlay-subtitle{

    font-family:
    'Cormorant Garamond',
    serif;

    color:white;

    letter-spacing:4px;

    text-transform:uppercase;

    text-shadow:
    0 2px 10px rgba(0,0,0,0.4);

    margin-top:10px;
}

/* PAGE 1 */

.page1-text{

    top:18%;
    left:50%;

    transform:
    translateX(-50%)
    translateY(40px);
}

.page.reveal .page1-text{

    transform:
    translateX(-50%)
    translateY(0px);
}

.page1-text .overlay-title{
    font-size:5rem;
}

.page1-text .overlay-subtitle{
    font-size:1rem;
}

/* PAGE 2 */

.page2-text{

    top:15%;
    left:50%;

    transform:
    translateX(-50%)
    translateY(40px);
}

.page.reveal .page2-text{

    transform:
    translateX(-50%)
    translateY(0px);
}

.page2-text .overlay-title{
    font-size:4rem;
}

.page2-text .overlay-subtitle{
    font-size:1rem;
}

/* PAGE 5 */

.page5-text{

    top:18%;
    left:50%;

    transform:
    translateX(-50%)
    translateY(40px);
}

.page.reveal .page5-text{

    transform:
    translateX(-50%)
    translateY(0px);
}

.page5-text .overlay-title{
    font-size:4.5rem;
}

.page5-text .overlay-subtitle{
    font-size:1rem;
}

/* =========================
ANIMATIONS
========================= */

@keyframes shimmer{

    0%{
        filter:brightness(1);
    }

    50%{
        filter:brightness(1.35);
    }

    100%{
        filter:brightness(1);
    }
}

@keyframes floatText{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-6px);
    }

    100%{
        transform:translateY(0px);
    }
}

@keyframes gentleFloat{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-6px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* =========================
MOBILE
========================= */

@media(max-width:768px){

    .envelope-wrapper{
        width:260px;
        height:200px;
    }

    .seal{
        width:75px;
        height:75px;
        font-size:1.6rem;
    }

    .invite-text h1{
        font-size:3rem;
    }

    .invite-text p{
        font-size:1rem;
    }

    .container{
        gap:24px;
        padding:20px 0;
    }

    .page{
        width:96vw;
        border-radius:12px;
    }

    .page1-text .overlay-title{
        font-size:3.2rem;
    }

    .page2-text .overlay-title{
        font-size:2.8rem;
    }

    .page5-text .overlay-title{
        font-size:3rem;
    }

    .overlay-subtitle{
        font-size:0.75rem !important;
        letter-spacing:2px;
    }
}

</style>
</head>

<body>

<div class="floating-elements"></div>

<!-- Loader -->

<div class="loader" id="loader">
    Loading Invitation...
</div>

<!-- Opening Screen -->

<div class="opening-screen" id="openingScreen">

    <div class="envelope-wrapper">

        <div class="envelope" id="envelope">

            <div class="envelope-back"></div>

            <div class="floral">
                ✿ ❀ ✿ ❀ ✿
            </div>

            <div class="envelope-flap"></div>

            <div class="seal" id="openInvite">
                A&A
            </div>

        </div>

    </div>

    <div class="invite-text">
        <h1>You're Invited</h1>
        <p>Tap the seal to open your invitation</p>
    </div>

</div>

<!-- Music -->

<audio id="bgMusic" loop playsinline>
    <source src="assets/background-music.mp3" type="audio/mpeg">
</audio>

<!-- Main Content -->

<div class="main-content" id="mainContent">

<div class="container">

    <!-- PAGE 1 -->

    <div class="page">

        <img src="assets/page_1.jpg">

        <div class="overlay-text page1-text">

            <div class="overlay-title">
                Anvi & Anuj
            </div>

            <div class="overlay-subtitle">
                Wedding Invitation
            </div>

        </div>

    </div>

    <!-- PAGE 2 -->

    <div class="page">

        <img src="assets/page_2.jpg">

        <div class="overlay-text page2-text">

            <div class="overlay-title">
                Save The Date
            </div>

            <div class="overlay-subtitle">
                A Beautiful Beginning
            </div>

        </div>

    </div>

    <!-- OTHER PAGES -->

    <div class="page"><img src="assets/page_3.jpg"></div>

    <div class="page"><img src="assets/page_4.jpg"></div>

    <!-- PAGE 5 -->

    <div class="page">

        <img src="assets/page_5.jpg">

        <div class="overlay-text page5-text">

            <div class="overlay-title">
                Forever Begins
            </div>

            <div class="overlay-subtitle">
                With Love & Blessings
            </div>

        </div>

    </div>

    <div class="page"><img src="assets/page_6.jpg"></div>
    <div class="page"><img src="assets/page_7.jpg"></div>
    <div class="page"><img src="assets/page_8.jpg"></div>
    <div class="page"><img src="assets/page_9.jpg"></div>
    <div class="page"><img src="assets/page_10.jpg"></div>
    <div class="page"><img src="assets/page_11.jpg"></div>
    <div class="page"><img src="assets/page_12.jpg"></div>
    <div class="page"><img src="assets/page_13.jpg"></div>
    <div class="page"><img src="assets/page_14.jpg"></div>

</div>

</div>

<script>

/* =========================
LOADER
========================= */

const loader = document.getElementById('loader');

window.addEventListener('load', () => {

    setTimeout(() => {
        loader.classList.add('hide');
    }, 1200);

});

/* =========================
MUSIC
========================= */

const music = document.getElementById('bgMusic');

music.volume = 1;

/* =========================
OPEN INVITE
========================= */

const envelope = document.getElementById('envelope');

const openInvite = document.getElementById('openInvite');

const openingScreen =
document.getElementById('openingScreen');

const mainContent =
document.getElementById('mainContent');

openInvite.addEventListener('click', async () => {

    envelope.classList.add('open');

    try{
        await music.play();
    }catch(err){
        console.log(err);
    }

    setTimeout(() => {

        openingScreen.classList.add('hide');

        mainContent.classList.add('show');

    }, 1600);

});

/* =========================
SCROLL REVEAL
========================= */

const pages = document.querySelectorAll('.page');

const observer = new IntersectionObserver(

    (entries) => {

        entries.forEach((entry) => {

            if(entry.isIntersecting){

                entry.target.classList.add('reveal');

            }

        });

    },

    {
        threshold:0.15
    }

);

pages.forEach((page) => {

    observer.observe(page);

});

/* =========================
FLOWERS
========================= */

const floatingContainer =
document.querySelector('.floating-elements');

function createFlower(){

    const flower =
    document.createElement('div');

    flower.classList.add('flower');

    const flowers =
    ['🌸','🌺','🌷','💮'];

    flower.innerHTML =
    flowers[Math.floor(Math.random() * flowers.length)];

    flower.style.left =
    Math.random() * 100 + 'vw';

    flower.style.fontSize =
    (14 + Math.random() * 18) + 'px';

    flower.style.animationDuration =
    (8 + Math.random() * 8) + 's';

    floatingContainer.appendChild(flower);

    setTimeout(() => {
        flower.remove();
    }, 16000);
}

/* =========================
BUTTERFLIES
========================= */

function createButterfly(){

    const butterfly =
    document.createElement('div');

    butterfly.classList.add('butterfly');

    butterfly.innerHTML = '🦋';

    butterfly.style.top =
    Math.random() * 80 + 'vh';

    butterfly.style.fontSize =
    (20 + Math.random() * 10) + 'px';

    butterfly.style.animationDuration =
    (12 + Math.random() * 10) + 's';

    floatingContainer.appendChild(butterfly);

    setTimeout(() => {
        butterfly.remove();
    }, 22000);
}

/* Generate Elements */

setInterval(createFlower,700);

setInterval(createButterfly,5000);

</script>

</body>
</html>
